<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Calculator</title>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --bg: #f3efe7;
        --ink: #1c1915;
        --muted: #6b645c;
        --card: #fffcf7;
        --line: #e4ddd2;
        --field: #ffffff;
        --accent: #0f6e56;
        --accent-soft: #e4f4ee;
        --warn: #9a3412;
        --glow-a: #dceee6;
        --glow-b: #f6e7c8;
        --shadow: 0 18px 50px rgba(50, 38, 20, 0.08);
        --results: #17362d;
        --results-ink: #f4faf7;
        --results-muted: #b7d4c8;
        --results-total: #8ee0c2;
        --results-line: rgba(255, 255, 255, 0.12);
        color-scheme: light;
      }

      html[data-theme="dark"] {
        --bg: #121614;
        --ink: #f2f4f1;
        --muted: #a3aea8;
        --card: #1c2320;
        --line: #33403b;
        --field: #151b18;
        --accent: #4ec9a4;
        --accent-soft: rgba(78, 201, 164, 0.18);
        --warn: #f0b090;
        --glow-a: #1a3a31;
        --glow-b: #2a2618;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        --results: #0f1f1a;
        --results-ink: #f4faf7;
        --results-muted: #9fc4b6;
        --results-total: #8ee0c2;
        --results-line: rgba(255, 255, 255, 0.1);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 400px at 10% -10%, var(--glow-a) 0%, transparent 55%),
          radial-gradient(700px 360px at 110% 10%, var(--glow-b) 0%, transparent 50%),
          var(--bg);
      }

      .card {
        width: min(440px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px 24px;
        box-shadow: var(--shadow);
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }

      .top h1 {
        margin: 0 0 6px;
        font-size: 1.55rem;
        letter-spacing: -0.03em;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      #theme-toggle {
        flex-shrink: 0;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 12px;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
      }

      #theme-toggle:hover,
      #theme-toggle:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--field);
        padding: 0 12px;
      }

      .field:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .prefix,
      .suffix {
        color: var(--muted);
        font-weight: 600;
      }

      input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        padding: 12px 0;
        font: inherit;
        font-size: 1.05rem;
        color: var(--ink);
      }

      .tips {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .tips button {
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 10px;
        padding: 8px 0;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
      }

      .tips button[aria-pressed="true"],
      .tips button:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      html[data-theme="dark"] .tips button[aria-pressed="true"],
      html[data-theme="dark"] .tips button:hover {
        color: #10231c;
      }

      .results {
        margin-top: 22px;
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 14px;
        background: var(--results);
        color: var(--results-ink);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      .row span {
        color: var(--results-muted);
        font-size: 0.85rem;
      }

      .row strong {
        font-size: 1.2rem;
        font-variant-numeric: tabular-nums;
      }

      .row.total {
        padding-top: 10px;
        border-top: 1px solid var(--results-line);
      }

      .row.total strong {
        color: var(--results-total);
        font-size: 1.45rem;
      }

      .hint {
        min-height: 1.2em;
        margin: 10px 0 0;
        color: var(--warn);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="top">
        <div>
          <h1>Tip calculator</h1>
          <p class="lede">Split the bill, add a tip, and see what each person owes.</p>
        </div>
        <button type="button" id="theme-toggle" aria-pressed="false">
          Dark
        </button>
      </div>

      <form id="tip-form" novalidate>
        <label>
          Bill amount
          <span class="field">
            <span class="prefix">$</span>
            <input
              id="bill"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.01"
              value="50"
              required
            />
          </span>
        </label>

        <label>
          Tip percent
          <span class="field">
            <input
              id="tip"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.5"
              value="18"
              required
            />
            <span class="suffix">%</span>
          </span>
        </label>

        <div class="tips" role="group" aria-label="Quick tip percents">
          <button type="button" data-tip="10">10%</button>
          <button type="button" data-tip="15">15%</button>
          <button type="button" data-tip="18" aria-pressed="true">18%</button>
          <button type="button" data-tip="20">20%</button>
        </div>

        <label>
          Number of people
          <span class="field">
            <input
              id="people"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              value="2"
              required
            />
          </span>
        </label>
      </form>

      <section class="results" aria-live="polite">
        <div class="row">
          <span>Tip</span>
          <strong id="tip-amount">$0.00</strong>
        </div>
        <div class="row">
          <span>Total</span>
          <strong id="total-amount">$0.00</strong>
        </div>
        <div class="row total">
          <span>Per person</span>
          <strong id="per-person">$0.00</strong>
        </div>
      </section>
      <p class="hint" id="hint"></p>
    </main>

    <script>
      const billInput = document.getElementById("bill");
      const tipInput = document.getElementById("tip");
      const peopleInput = document.getElementById("people");
      const tipOut = document.getElementById("tip-amount");
      const totalOut = document.getElementById("total-amount");
      const perPersonOut = document.getElementById("per-person");
      const hint = document.getElementById("hint");
      const themeToggle = document.getElementById("theme-toggle");
      const money = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      function asNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      }

      function currentTheme() {
        return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("theme", theme);
        const isDark = theme === "dark";
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.textContent = isDark ? "Light" : "Dark";
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );
      }

      function setPresetState() {
        const current = tipInput.value;
        document.querySelectorAll(".tips button").forEach((btn) => {
          btn.setAttribute("aria-pressed", String(btn.dataset.tip === current));
        });
      }

      function calculate() {
        const bill = asNumber(billInput.value);
        const tipPercent = asNumber(tipInput.value);
        const people = Math.trunc(asNumber(peopleInput.value));

        if (bill < 0 || tipPercent < 0) {
          hint.textContent = "Bill and tip must be zero or greater.";
          return;
        }

        if (people < 1) {
          hint.textContent = "Enter at least one person to split the bill.";
          tipOut.textContent = money.format(0);
          totalOut.textContent = money.format(0);
          perPersonOut.textContent = money.format(0);
          return;
        }

        hint.textContent = "";
        const tipAmount = bill * (tipPercent / 100);
        const total = bill + tipAmount;
        tipOut.textContent = money.format(tipAmount);
        totalOut.textContent = money.format(total);
        perPersonOut.textContent = money.format(total / people);
      }

      [billInput, tipInput, peopleInput].forEach((input) => {
        input.addEventListener("input", () => {
          setPresetState();
          calculate();
        });
      });

      document.querySelectorAll(".tips button").forEach((btn) => {
        btn.addEventListener("click", () => {
          tipInput.value = btn.dataset.tip;
          setPresetState();
          calculate();
        });
      });

      themeToggle.addEventListener("click", () => {
        applyTheme(currentTheme() === "dark" ? "light" : "dark");
      });

      applyTheme(currentTheme());
      setPresetState();
      calculate();
    </script>
  </body>
</html>
